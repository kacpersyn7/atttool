name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: AttTool-${{ github.sha }}
          path: dist/AttTool.html
          retention-days: 30
