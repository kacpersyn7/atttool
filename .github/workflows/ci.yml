name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm test
      - run: npm run build
        env:
          BUILD_LABEL: ${{ github.event_name == 'pull_request' && format('PR #{0} build', github.event.number) || 'main' }} ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: AttTool-${{ github.sha }}
          path: dist/AttTool.html
          retention-days: 30
