# Publishes a GitHub Release with the single-file AttTool.html for every v* tag.
# Works whether the tag is pushed from git, created in GitHub's "Draft a new release" page,
# or typed into "Run workflow" (a missing tag is then created on the latest main).
name: Release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: { description: 'Version tag, e.g. v0.3.0. Created on the latest main if it does not exist yet.', required: true }
permissions:
  contents: write
  actions: write   # to trigger the Pages redeploy
concurrency:
  group: release-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create the tag on main if it does not exist
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Tag must look like v1.2.3, got '$TAG'"; exit 1;; esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists"
          else
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
            echo "Created tag $TAG at main ($SHA)"
          fi
      - uses: actions/checkout@v5
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Tag must match package.json version
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$TAG" ]; then echo "::warning::tag $TAG but package.json says $V"; fi
      - run: npm test
      - run: npm run build
      - name: Create or update the release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/AttTool.html --clobber
      - name: Redeploy the live site with the new version
        run: gh workflow run pages.yml --ref main || true
