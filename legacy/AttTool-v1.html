<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>AttTool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: mission-console — fixed control rail left, live 3D viewport right, instrument overlays on the viewport.
   Deliberately single dark look (space viewport); all colors explicit. */
:root{
  color-scheme: dark;
  --ink0:#0a1018;      /* page / viewport ground */
  --ink1:#101925;      /* rail */
  --ink2:#162232;      /* cards */
  --ink3:#1e2d41;      /* inputs */
  --line:#263750;
  --text:#d9e2ee;
  --muted:#8697ae;
  --faint:#5d6e86;
  --sun:#f2a93b;       /* accent = sunlight */
  --sun-soft:rgba(242,169,59,.14);
  --ax-x:#ff6161; --ax-y:#46d38a; --ax-z:#4f8cff;
  --eig:#c48bff; --probe:#ff7bd5; --cyan:#4fd6e8;
  --ok:#46d38a; --warn:#f2c23b; --bad:#ff5f5f;
  --f-ui:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail:388px;
}
html,body{height:100%}
body{background:var(--ink0);color:var(--text);font-family:var(--f-ui);font-size:14px;margin:0;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%}
header{display:flex;align-items:center;gap:16px;padding:0 16px;height:50px;border-bottom:1px solid var(--line);background:var(--ink1)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;font-size:17px;white-space:nowrap}
.brand svg{flex:none}
.brand small{font-weight:500;color:var(--muted);letter-spacing:.02em;font-size:13px}
nav.tabs{display:flex;gap:2px;height:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:0 14px;color:var(--muted);font-weight:600;font-size:14.5px;letter-spacing:.02em;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--sun)}
nav.tabs button .k{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-right:6px}
.hspace{flex:1}
.hbtn{background:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--text);font-weight:500;white-space:nowrap}
.hbtn:hover{border-color:var(--sun)}
main{display:grid;grid-template-columns:var(--rail) 1fr;min-height:0}
aside{min-width:0;background:var(--ink1);border-right:1px solid var(--line);overflow-y:auto;padding:12px 12px 40px;display:flex;flex-direction:column;gap:10px;min-height:0}
#vp{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--ink0)}
#vp canvas.main{display:block;width:100%;height:100%;outline:none}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 .tag{font-family:var(--f-mono);letter-spacing:0;text-transform:none;font-size:11px;color:var(--faint);font-weight:400}
.tip{font-size:13px;color:var(--muted);line-height:1.4;margin:0}
.tip b{color:var(--text);font-weight:600}
.row{display:grid;grid-template-columns:108px 1fr 70px;align-items:center;gap:8px}
.row.two{grid-template-columns:108px 1fr}
.row label,.lbl{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row label .ax{font-family:var(--f-mono);font-size:12px}
input[type=range]{width:100%;accent-color:var(--sun);height:18px;margin:0;min-width:0}
input[type=number],input[type=text],input[type=datetime-local],select,textarea{background:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:4px 6px;min-width:0;width:100%}
input[type=number]{font-family:var(--f-mono);font-size:12.5px;text-align:right;-moz-appearance:textfield}
input::-webkit-inner-spin-button{opacity:.4}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
select{padding:5px 6px;cursor:pointer}
textarea{font-family:var(--f-mono);font-size:11.5px;min-height:90px;resize:vertical}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cell{display:flex;flex-direction:column;gap:2px;min-width:0}
.cell span{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--sun);color:#fff}
.btn.primary{background:var(--sun);color:#1a1205;border-color:var(--sun);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:#1a1205}
.btn.on{border-color:var(--sun);background:var(--sun-soft)}
.btn.mono{font-family:var(--f-mono);font-size:12px}
.btn.danger:hover{border-color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{background:var(--ink3);border:0;padding:3px 9px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--sun-soft);color:var(--text)}
.mat{font-family:var(--f-mono);font-size:12.5px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px;padding:8px 10px;background:var(--ink0);border-radius:6px;border-left:2px solid var(--line);border-right:2px solid var(--line);font-variant-numeric:tabular-nums}
.mat div{text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.dim{color:var(--muted)}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;color:var(--text)}
.chk input{accent-color:var(--sun)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.formula{font-family:var(--f-mono);font-size:12px;color:var(--text);background:var(--ink0);border-radius:5px;padding:6px 8px;overflow-x:auto;white-space:nowrap}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px}
details.more[open] summary{margin-bottom:6px}
.complist{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow-y:auto}
.comp{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:4px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%}
.comp:hover{background:var(--ink3)}
.comp.sel{border-color:var(--sun);background:var(--sun-soft)}
.comp i{width:10px;height:10px;border-radius:2px}
.comp small{color:var(--faint);font-family:var(--f-mono);font-size:11px}
/* viewport overlays */
.ov{position:absolute;pointer-events:none;font-size:12.5px}
.ov>*{pointer-events:auto}
.hud{background:rgba(10,16,24,.78);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#hudTL{top:12px;left:12px;max-width:min(340px,calc(100% - 24px))}
#hudTR{top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
#caption{left:50%;transform:translateX(-50%);bottom:18px;max-width:min(560px,calc(100% - 24px));text-align:center;font-size:14px}
#caption .hud{padding:8px 14px}
#inset{position:absolute;right:12px;width:min(290px,42%);aspect-ratio:1/1;border:1px solid var(--line);border-radius:8px;cursor:grab;touch-action:none}
#inset .t{position:absolute;top:6px;left:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);pointer-events:none}
#timeline{position:absolute;left:12px;right:12px;bottom:12px;height:auto}
#timeline canvas{width:100%;display:block;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.hud .kv{min-width:220px}
.hud h4{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vbtn{background:rgba(16,25,37,.85);border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;color:var(--text)}
.vbtn:hover,.vbtn.on{border-color:var(--sun)}
#modal{position:fixed;inset:0;background:rgba(4,8,14,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .box{background:var(--ink1);border:1px solid var(--line);border-radius:10px;max-width:720px;width:100%;max-height:88vh;overflow-y:auto;padding:18px 22px}
#modal h2{margin:0 0 6px;font-size:20px}
#modal h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--sun);margin:18px 0 6px}
#modal p,#modal li{color:var(--text);line-height:1.5;max-width:68ch}
#modal code{font-family:var(--f-mono);font-size:12.5px;background:var(--ink0);padding:1px 5px;border-radius:4px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--sun);color:#1a1205;font-weight:600;padding:6px 14px;border-radius:6px;z-index:30;transition:opacity .2s}
.status{display:flex;flex-wrap:wrap;gap:6px}
.contents{display:contents}
[hidden]{display:none!important}
@media (max-width:860px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto}
  nav.tabs{min-width:0;flex:1 1 auto}
  .hspace{display:none}
  .hbtn{padding:5px 8px}
  #hudTL{font-size:11px}
  #hudTL .hud{padding:6px 8px}
  #hudTL .kv{min-width:0;font-size:11.5px}
  #hudTL .kv dd{font-size:11px}
  #hudTL .legend,#hudTL .tip{display:none}
  #vp{grid-row:1;min-height:360px}
  aside{grid-row:2;border-right:0;border-top:1px solid var(--line);overflow:visible;padding-inline:16px}
  .brand small{display:none}
  header{padding-inline:12px;gap:8px}
  #inset{width:min(180px,40%)}
  #hudTR{max-width:50%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script>
/* ===================== ATTITUDE MATH CORE =====================
 Conventions (documented in-app):
 - C_BR : DCM, reference -> body. v_B = C_BR * v_R. Rows = body axes expressed in R.
 - Quaternion q = {w,x,y,z}. Same numbers can be read two ways:
     * Hamilton, active: R(q) = C_RB  (rotates reference axes onto body axes)
     * Shuster/JPL (Markley & Crassidis): A(q) = C_BR
 - Euler "i-j-k" (e.g. 3-2-1): C_BR = R_k(t3) R_j(t2) R_i(t1), R_n = frame (passive) rotations.
   i.e. rotate frame by t1 about axis i, then t2 about NEW axis j, then t3 about NEWEST axis k.
================================================================ */
const AM = (() => {
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const v = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    norm: a => Math.hypot(a[0], a[1], a[2]),
    unit: a => { const n = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / n, a[1] / n, a[2] / n]; },
    angle: (a, b) => Math.acos(Math.max(-1, Math.min(1, v.dot(v.unit(a), v.unit(b))))),
  };
  // 3x3 matrices as arrays of rows
  const m = {
    I: () => [[1, 0, 0], [0, 1, 0], [0, 0, 1]],
    mul: (A, B) => A.map((r, i) => [0, 1, 2].map(j => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j])),
    mulv: (A, x) => A.map(r => r[0] * x[0] + r[1] * x[1] + r[2] * x[2]),
    T: A => [0, 1, 2].map(i => [A[0][i], A[1][i], A[2][i]]),
    det: A => A[0][0] * (A[1][1] * A[2][2] - A[1][2] * A[2][1]) - A[0][1] * (A[1][0] * A[2][2] - A[1][2] * A[2][0]) + A[0][2] * (A[1][0] * A[2][1] - A[1][1] * A[2][0]),
    fromCols: (c0, c1, c2) => [[c0[0], c1[0], c2[0]], [c0[1], c1[1], c2[1]], [c0[2], c1[2], c2[2]]],
    fromRows: (r0, r1, r2) => [r0.slice(), r1.slice(), r2.slice()],
    col: (A, j) => [A[0][j], A[1][j], A[2][j]],
  };
  // passive (frame) elementary rotation about axis n (1,2,3)
  function Rp(n, a) {
    const c = Math.cos(a), s = Math.sin(a);
    if (n === 1) return [[1, 0, 0], [0, c, s], [0, -s, c]];
    if (n === 2) return [[c, 0, -s], [0, 1, 0], [s, 0, c]];
    return [[c, s, 0], [-s, c, 0], [0, 0, 1]];
  }
  const Ra = (n, a) => m.T(Rp(n, a)); // active rotation
  // ---- quaternion ----
  const q = {
    id: () => ({ w: 1, x: 0, y: 0, z: 0 }),
    norm: p => Math.hypot(p.w, p.x, p.y, p.z),
    unit: p => { const n = q.norm(p) || 1; return { w: p.w / n, x: p.x / n, y: p.y / n, z: p.z / n }; },
    neg: p => ({ w: -p.w, x: -p.x, y: -p.y, z: -p.z }),
    conj: p => ({ w: p.w, x: -p.x, y: -p.y, z: -p.z }),
    // Hamilton product a∘b
    hmul: (a, b) => ({
      w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z,
      x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
      y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
      z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w,
    }),
    canon: p => (p.w < 0 ? q.neg(p) : p),
  };
  // q -> C_BR (Shuster attitude matrix A(q))
  function q2C(p) {
    const { w, x, y, z } = p;
    return [
      [w * w + x * x - y * y - z * z, 2 * (x * y + w * z), 2 * (x * z - w * y)],
      [2 * (x * y - w * z), w * w - x * x + y * y - z * z, 2 * (y * z + w * x)],
      [2 * (x * z + w * y), 2 * (y * z - w * x), w * w - x * x - y * y + z * z],
    ];
  }
  // C_BR -> q (Shepperd)
  function C2q(A) {
    const tr = A[0][0] + A[1][1] + A[2][2];
    let r;
    const cands = [tr, A[0][0], A[1][1], A[2][2]];
    const k = cands.indexOf(Math.max(...cands));
    if (k === 0) { const w = 0.5 * Math.sqrt(1 + tr); r = { w, x: (A[1][2] - A[2][1]) / (4 * w), y: (A[2][0] - A[0][2]) / (4 * w), z: (A[0][1] - A[1][0]) / (4 * w) }; }
    else if (k === 1) { const x = 0.5 * Math.sqrt(1 + A[0][0] - A[1][1] - A[2][2]); r = { x, w: (A[1][2] - A[2][1]) / (4 * x), y: (A[0][1] + A[1][0]) / (4 * x), z: (A[0][2] + A[2][0]) / (4 * x) }; }
    else if (k === 2) { const y = 0.5 * Math.sqrt(1 - A[0][0] + A[1][1] - A[2][2]); r = { y, w: (A[2][0] - A[0][2]) / (4 * y), x: (A[0][1] + A[1][0]) / (4 * y), z: (A[1][2] + A[2][1]) / (4 * y) }; }
    else { const z = 0.5 * Math.sqrt(1 - A[0][0] - A[1][1] + A[2][2]); r = { z, w: (A[0][1] - A[1][0]) / (4 * z), x: (A[0][2] + A[2][0]) / (4 * z), y: (A[1][2] + A[2][1]) / (4 * z) }; }
    return q.canon(q.unit(r));
  }
  // ---- Euler ----
  const SEQS = ['321', '312', '213', '231', '123', '132', '313', '323', '121', '131', '212', '232'];
  const seqAxes = s => s.split('').map(Number);
  const isSymmetric = s => s[0] === s[2];
  function euler2C(seq, t) { // t in rad
    const [i, j, k] = seqAxes(seq);
    return m.mul(Rp(k, t[2]), m.mul(Rp(j, t[1]), Rp(i, t[0])));
  }
  function rotAngleAbout(M, n) { // active rotation M about axis n (0-based) -> angle
    const p = (n + 1) % 3, r = (n + 2) % 3;
    return Math.atan2(M[r][p], M[p][p]);
  }
  // C_BR -> euler (rad). Uses Bernardes & Viollet (2022) on the Hamilton active quaternion of C_RB,
  // intrinsic sequence. Gimbal-lock: t1 := 0, t3 solved from residual.
  function C2euler(seq, C) {
    const qq = C2q(C);
    const Q = [qq.w, qq.x, qq.y, qq.z];
    let [I, J, K] = seqAxes(seq);
    // intrinsic (I,J,K) == extrinsic (K,J,I)
    let i = K, j = J, k = I;
    const proper = i === k;
    if (proper) k = 6 - i - j;
    const eps = (i - j) * (j - k) * (k - i) / 2;
    let a, b, c, d;
    if (proper) { a = Q[0]; b = Q[i]; c = Q[j]; d = Q[k] * eps; }

  }
  function exportCode() {
    const lines = ['# AttTool export — body frame B, component frame C (+Z_C = boresight/spin/dipole/normal)', '# C_CB maps body-frame vectors into the component frame: v_C = C_CB @ v_B', 'import numpy as np', ''];
    for (const c of S.sc.comps) {

    }
    const ws = S.sc.comps.filter(c => c.type === 'rw'); if (ws.length) lines.push('# reaction-wheel spin-axis matrix (columns = wheels)', `A_rw = np.array([${[0, 1, 2].map(r => '[' + ws.map(c => compAxis(c)[r].toFixed(6)).join(', ') + ']').join(', ')}])`, '');
    lines.push('# mass properties about CoM, body axes', `mass = ${MP.M.toFixed(3)}  # kg`, `com_B = np.array([${MP.com.map(x => x.toFixed(5)).join(', ')}])`, `J = np.array([${MP.I.map(r => '[' + r.map(x => x.toFixed(5)).join(', ') + ']').join(', ')}])  # kg m^2`);

  function importDlg() {

      try { const j = JSON.parse(ta.value); const sc = j.sc || j; if (!sc.bus || !Array.isArray(sc.comps)) throw new Error('Expected an object with "bus" and "comps".'); sc.comps.forEach(c => { if (!TYPES[c.type]) throw new Error('Unknown component type "' + c.type + '".'); c.id = c.id || newId(); c.q = AM.q.unit(c.q); delete c.eul; }); S.sc = sc; S.layout.sel = null; scChanged(); $('#modal').hidden = true; renderRail(); toast('Configuration imported'); }

      liveText(() => { const c = sel(); return c ? `<p class="tip" style="margin-top:6px">Selected <b>${c.name}</b> at [${c.pos.map(x => fmt(x, 2)).join(', ')}] m</p>` : '<p class="tip" style="margin-top:6px">Click a component to select it.</p>'; })));

const VIEWS = { rot: ROT, orbit: ORB, layout: LAY };
function renderRail() {
  syncs = []; live = [];
  const rail = $('#rail'); const st = rail.scrollTop; rail.innerHTML = ''; rail.append(...VIEWS[S.tab].panel());
  $('#hudTL').innerHTML = ''; $('#hudTR').innerHTML = ''; VIEWS[S.tab].hud();

}
function setTab(t) {
  if (!VIEWS[t]) return; const prev = VIEWS[S.tab];
  prev.V.controls.enabled = false; prev.leave && prev.leave();
  S.tab = t; save();
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  const v = VIEWS[t]; v.V.controls.enabled = true; v.enter && v.enter();
  $('#caption').hidden = true; $('#rail').scrollTop = 0; renderRail(); resize();
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
function resize() {
  const { w, h: H } = sizeOf(); renderer.setSize(w, H, false);
  for (const v of Object.values(VIEWS)) { v.V.camera.aspect = w / H; v.V.camera.updateProjectionMatrix(); }
}
new ResizeObserver(resize).observe(vp);
window.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === '1') setTab('rot'); else if (e.key === '2') setTab('orbit'); else if (e.key === '3') setTab('layout');
  else if (e.key === ' ' && S.tab === 'orbit') { S.orbit.playing = !S.orbit.playing; save(); syncAll(); e.preventDefault(); }
  else if (e.key === 'Escape') { $('#modal').hidden = true; }
});
$('#btnConv').addEventListener('click', () => showModal(h('div', { html: `
<h2>Conventions used in AttTool</h2>
<p>Every number in this tool follows one consistent set of rules. Most bugs in attitude code come from mixing two of them.</p>
<h3>Frames</h3>
<ul>
<li><b>R</b> — generic reference frame in the Rotation Lab. In <i>Inertial</i> guidance it is ECI.</li>
<li><b>ECI</b> — X to the vernal equinox ♈, Z to the celestial north pole (J2000-like; precession ignored).</li>
<li><b>ECEF</b> — Earth-fixed, rotates about Z by GMST. Ground track and targets live here.</li>
<li><b>LVLH</b> — z<sub>L</sub> = −r̂ (nadir), y<sub>L</sub> = −ĥ (negative orbit normal), x<sub>L</sub> = y<sub>L</sub>×z<sub>L</sub> (≈ velocity on a circular orbit).</li>
<li><b>B</b> — body frame, origin at the bus centre. Example EO layout: +Z nadir/payload, +X flight direction when nadir pointing.</li>
<li><b>C</b> — a component's own frame. +Z<sub>C</sub> is its boresight / spin axis / dipole axis / panel normal.</li>
</ul>
<h3>Direction cosine matrices</h3>
<p><code>C_BR</code> transforms coordinates <i>from R to B</i>: <code>v_B = C_BR · v_R</code>. Its rows are the B axes written in R. <code>C_RB = C_BRᵀ</code>. Chains read right to left: <code>C_CI = C_CB · C_BI</code>.</p>
<h3>Euler angles</h3>
<p>Sequence i-j-k (e.g. 3-2-1) means intrinsic rotations: θ₁ about axis i of R, θ₂ about the <i>new</i> j axis, θ₃ about the <i>newest</i> k axis. <code>C_BR = R_k(θ₃)·R_j(θ₂)·R_i(θ₁)</code> with frame-rotation matrices, e.g. <code>R₃(ψ) = [[c, s, 0], [−s, c, 0], [0, 0, 1]]</code>. 3-2-1 = yaw ψ, pitch θ, roll φ.</p>
<h3>Quaternions</h3>
<p><code>q = [q₀; q₁ q₂ q₃] = [cos(φ/2); ê sin(φ/2)]</code>. The attitude matrix is <code>C_BR = A(q) = (q₀² − |q_v|²)I + 2 q_v q_vᵀ − 2 q₀[q_v×]</code> (Shuster/JPL reading, same numbers as the Hamilton quaternion of the active rotation R→B). Toggle scalar-first / scalar-last in the Rotation Lab. q and −q are the same attitude.</p>
<h3>Environment models (deliberately simple)</h3>
<ul>
<li>Orbit: Keplerian two-body with optional J2 secular drift of Ω and ω. No drag, no SRP.</li>
<li>Sun: low-precision almanac formula (~0.01°). Eclipse: cylindrical shadow (no penumbra).</li>
<li>Magnetic field: tilted dipole, pole at 80.8°N 72.7°W, B₀ = 29 900 nT. Real IGRF differs by up to ~20 %.</li>
<li>Star tracker availability: blinded if the Sun is inside the Sun-exclusion angle (outside eclipse) or the Earth limb is closer than the Earth-exclusion angle. Moon ignored.</li>
</ul>
<h3>Keyboard</h3>
<p><code>1</code> <code>2</code> <code>3</code> switch workspaces · <code>Space</code> play/pause the orbit · drag = orbit camera, scroll = zoom, right-drag = pan.</p>` })));

// main loop
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const v = VIEWS[S.tab];
  try { v.update(dt); v.render(); } catch (e) { console.error(e); }
  acc += dt;
  if (acc > 0.1) { acc = 0; live.forEach(f => f()); if (S.tab === 'orbit') { ORB.drawTimeline(); ORB.layoutOverlays(); if (S.orbit.playing) syncAll(); } }
}
function boot() {
  if (!S.rot.aaAxis) S.rot.aaAxis = AM.q2axisAngle(S.rot.q).axis;
  let t0 = location.hash.replace('#', ''); if (VIEWS[t0]) S.tab = t0;
  const start = S.tab; S.tab = 'rot'; ROT.V.controls.enabled = false; setTab(start);
  requestAnimationFrame(loop);
}
boot();
}
