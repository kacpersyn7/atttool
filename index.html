<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AttTool</title>
  <!-- Build label shown after the version. scripts/build.mjs replaces it with $BUILD_LABEL, or removes it for releases. -->
  <meta name="atttool-build" content="local dev">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="src/styles.css">
  <!-- three.js r128 from CDN. Keep the version in sync with THREE_VERSION in scripts/build.mjs. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="#263750" stroke-width="1.4"/><path d="M12 12 L21 12" stroke="#ff6161" stroke-width="2.2" stroke-linecap="round"/><path d="M12 12 L5.6 5.6" stroke="#46d38a" stroke-width="2.2" stroke-linecap="round"/><path d="M12 12 L12 2.6" stroke="#4f8cff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#f2a93b"/></svg>
      ATTTOOL <small>attitude workbench <span id="ver"></span></small>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-rot" data-tab="rot"><span class="k">1</span>Rotation Lab</button>
      <button role="tab" id="tab-orbit" data-tab="orbit"><span class="k">2</span>Orbit &amp; Frames</button>
      <button role="tab" id="tab-layout" data-tab="layout"><span class="k">3</span>Spacecraft Layout</button>
    </nav>
    <div class="hspace"></div>
    <button class="hbtn" id="btnConv">Conventions</button>
  </header>
  <main>
    <aside id="rail"></aside>
    <div id="vp">
      <div class="ov" id="hudTL"></div>
      <div class="ov" id="hudTR"></div>
      <div class="ov" id="caption" hidden><div class="hud" id="captionText"></div></div>
      <div id="inset" hidden><span class="t">Body frame view · drag</span></div>
      <div class="ov" id="timeline" hidden><div class="hud"><canvas id="tlc" height="110"></canvas></div></div>
    </div>
  </main>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<noscript><p style="padding:16px">AttTool needs JavaScript.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
